allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
    afterEvaluate { p ->
        if (p.hasProperty("android")) {
            if (p.android.namespace == null) {
                p.android.namespace = "com.example.${p.name.replaceAll('[^a-zA-Z0-9_]', '_')}"
            }
            // Strip package attribute from AndroidManifest.xml to fix AGP 8+
            def manifestFile = file("${p.projectDir}/src/main/AndroidManifest.xml")
            if (manifestFile.exists()) {
                def content = manifestFile.text
                if (content.contains("package=")) {
                    content = content.replaceAll(/package="[^"]*"/, "")
                    manifestFile.text = content
                }
            }
        }
    }
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}